<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MH Digital ID | Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- Animated Background -->

<div class="background-animation">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>


<div class="login-wrapper">


    <!-- Left Section -->

    <div class="welcome-section">

        <div class="welcome-content">

            <div class="company-logo">
                MH
            </div>


            <h1>
                Digital Identity
            </h1>


            <p>
                Secure access to your employee
                digital identity.
            </p>


            <div class="feature-list">

                <div class="feature-item">

                    <i class="bi bi-shield-check"></i>

                    <span>
                        Secure Employee Identity
                    </span>

                </div>


                <div class="feature-item">

                    <i class="bi bi-qr-code-scan"></i>

                    <span>
                        QR Based Verification
                    </span>

                </div>


                <div class="feature-item">

                    <i class="bi bi-person-badge"></i>

                    <span>
                        Digital Employee Card
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Login Section -->

    <div class="login-section">


        <div class="login-card">


            <!-- Header -->

            <div class="login-header">

                <div class="mobile-logo">
                    MH
                </div>

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to access your Digital ID
                </p>

            </div>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <div class="input-group-custom">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="input-group-custom">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >

                            <i
                                class="bi bi-eye"
                                id="eyeIcon"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- Remember -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Error / Success -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="buttonText">
                        Sign In
                    </span>

                    <span
                        id="buttonLoader"
                        class="spinner-border spinner-border-sm d-none"
                    ></span>

                </button>


            </form>


            <div class="security-note">

                <i class="bi bi-shield-lock"></i>

                <span>
                    Your information is protected
                </span>

            </div>


        </div>

    </div>

</div>


<script src="js/script.js"></script>

</body>

</html>
